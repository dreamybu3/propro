[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gaplens"
version = "0.2.0"
description = "Auditable offline gap reconstruction for monitoring time series"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "scikit-learn==1.6.1",
  "matplotlib==3.10.3",
]

[project.scripts]
gaplens = "gaplens.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/gaplens"]

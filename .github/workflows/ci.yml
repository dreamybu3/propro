name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python scripts/fetch_data_v2.py --verify-only
      - run: python scripts/verify_v2.py --input results/v2/benchmark
      - run: python scripts/make_demo.py --output ci-demo
      - run: gaplens repair --reference ci-demo/reference.csv --input ci-demo/with_gaps.csv --output demo-output --require-complete
      - run: gaplens repair --reference ci-demo/reference.csv --input ci-demo/with_gaps.csv --output diverse-demo-output --method diverse --require-complete
